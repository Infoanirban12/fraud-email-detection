<!DOCTYPE html>
<html>
<head>
    <title>Fraud Email Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center text-primary mb-4">📧 Fraud Email Detection</h1>

    <div class="card p-4 shadow">
        <h4>Upload Dataset</h4>
        <form action="/train" method="post" enctype="multipart/form-data">
            <input type="file" name="file" class="form-control mb-3" required>
            <button class="btn btn-success w-100">Train Model</button>
        </form>
    </div>

    <div class="card p-4 shadow mt-4">
        <h4>Test Email</h4>
        <form action="/predict" method="post">
            <textarea name="email" class="form-control mb-3" rows="4" placeholder="Enter email"></textarea>
            <button class="btn btn-primary w-100">Predict</button>
        </form>
    </div>

</div>

</body>
</html>
